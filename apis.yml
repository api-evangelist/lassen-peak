aid: lassen-peak
name: Lassen Peak
description: >-
  Lassen Peak, Inc. is a Seattle-area public-safety technology company founded in 2019 by veterans of
  ultra-high-speed wireless, imaging radar, broadband communications and law enforcement. It builds
  AirFrisk, a handheld terahertz imaging-radar scanner that detects concealed weapons at a distance
  without a hands-on pat-down, and ImageVault, the companion cloud console that manages AirFrisk users,
  devices, scan data, retention policy, alerts, reporting and audit logs for an agency under FBI-CJIS
  compliant storage. The company has raised roughly $22M across Series A and A1 rounds and holds
  multiple issued US patents. Lassen Peak sells a device plus a customer-tenant cloud console to police,
  sheriff and security agencies; as of this profile it publishes no public developer program, no API
  documentation, no SDKs and no machine-readable contract of any kind on its own domain.
